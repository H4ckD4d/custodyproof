[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="custodyproof"
version="0.1.0"
description="File integrity and chain of custody records"
requires-python=">=3.11"
authors=[{name="Chris Cruz (@h4ckd4d)"}]
dependencies=[]
[project.optional-dependencies]
ai=["google-genai>=1.0,<3"]
[project.scripts]
custodyproof="custodyproof.cli:main"
[tool.setuptools.packages.find]
where=["src"]
